[package]
name = "rtk"
version = "0.1.0"
edition = "2021"

[lib]
name = "rtk"
path = "src/lib.rs"

[[bin]]
name = "rtk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr.workspace = true
serde_yaml_with_quirks.workspace = true
tabwriter = "1.4"
rayon = "1.10"
rustc-hash.workspace = true
walkdir = "2.5"
regex = "1.10"

# jrsonnet dependencies for evaluation
jrsonnet-evaluator.workspace = true
jrsonnet-lint.workspace = true
jrsonnet-ir.workspace = true
jrsonnet-gcmodule.workspace = true

# Kubernetes client for diff command
k8s = { path = "../../crates/k8s" }
kube.workspace = true
k8s-openapi.workspace = true
tokio.workspace = true
bon = "3.8.2"
rtk-diff = { path = "../../crates/diff" }

# The exporter, and the Jsonnet engine it evaluates environments with
rtk-environments.workspace = true
rtk-jsonnet.workspace = true
rtk-spec.workspace = true

# Telemetry
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "reqwest-rustls"] }
thiserror.workspace = true
dirs = "6.0.0"
http = "1.4.0"
tempfile = "3.10"

[target.'cfg(target_os = "linux")'.dependencies]
mimallocator = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.10"
assert_matches = "1.5.0"
rstest = "0.26.1"
indoc.workspace = true
toml = "0.8"
patch = "0.7"
tower-test = "0.4.0"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1.8.1"
bytes = "1.11.0"
serde_yaml = "0.9.34"
paste = "1.0.15"
urlencoding = "2.1.3"
k8s-mock = { path = "../../crates/k8s-mock" }

[features]
default = ["mimalloc"]
# Use mimalloc as allocator (enabled by default, Linux only)
mimalloc = ["mimallocator"]
# Use the system allocator instead of mimalloc
system-alloc = []
