[package]
name = "rtk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rtk"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabwriter = "1.4"
rayon = "1.10"
num_cpus = "1.16"

# jrsonnet dependencies for evaluation
jrsonnet-evaluator = { path = "../../crates/jrsonnet-evaluator" }
jrsonnet-stdlib = { path = "../../crates/jrsonnet-stdlib" }
jrsonnet-parser = { path = "../../crates/jrsonnet-parser" }
jrsonnet-gcmodule = { version = "0.3.7" }

[dev-dependencies]
tempfile = "3.10"

