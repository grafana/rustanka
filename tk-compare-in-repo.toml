# Comparing Grafana Tanka (tk) with rustanka (rtk) over **this repository's own
# fixtures**: golden eval, golden export and diff.
#
# Usage:
#   cargo run -p tk-compare --release -- tk-compare-in-repo.toml
#   make tk-compare
#
# Environment variables:
#   TK_PATH  - Path to tk executable (optional; default: tk)
#   RTK_PATH - Path to rtk executable (optional; default: rtk)
#
# This file was called `tk-compare-grafana.toml`, and the fmt port plan
# cited that name for Phase 5's acceptance gate — "Grafana's real Jsonnet,
# vendor included, thousands of files". It was never that. Every `fixtures_dir`
# below names a directory inside this repository, nothing cloned an external
# checkout, and `fixtures_dir` passing through `expand_env_vars` was the only
# hint that one was ever intended.
#
# So it is named for what it holds. Phase 5's acceptance corpus is
# `fmt-acceptance.toml`, which pins public Grafana repositories and records
# where they came from; that file carries the argument in full.

[[tests]]
name = "golden eval"
working_dir = "{{testcase}}"
workspace = true
fixtures_dir = "test_fixtures/golden_envs"
args = ["eval", "."]
compare = ["{{tk-compare}}", "compare", "json"]

[[tests]]
name = "golden export"
working_dir = "{{testcase}}"
workspace = true
fixtures_dir = "test_fixtures/golden_envs"
args = ["export", "{{destination}}", "."]
compare = ["{{tk-compare}}", "compare", "directory"]

[[tests]]
name = "diff"
working_dir = "."
workspace = false
fixtures_dir = "cmds/rtk/tests/testdata/diff"
fixture_name_prefix = "diff"
fixture_cluster_dir = "cluster"
args = ["diff", "{{testcase}}/environment"]
compare = ["{{tk-compare}}", "compare", "unified-diff"]
