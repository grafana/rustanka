{{- range $i := until (int .Values.itemCount) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $.Release.Name }}-rb-{{ $i }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $.Release.Name }}-role-{{ $i }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}-sa-{{ $i }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
