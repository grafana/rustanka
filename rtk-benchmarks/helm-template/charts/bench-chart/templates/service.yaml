{{- range $i := until (int .Values.itemCount) }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-bench-{{ $i }}
  labels:
    {{- range $k := until (int $.Values.labelCount) }}
    label-{{ $k }}: {{ sha256sum (printf "%s-%d-svc-%d" $.Release.Name $i $k) | trunc 32 }}
    {{- end }}
spec:
  type: {{ $.Values.service.type }}
  selector:
    app: {{ $.Release.Name }}-bench-{{ $i }}
  ports:
    - port: {{ $.Values.service.port }}
      targetPort: {{ $.Values.service.port }}
{{- end }}
