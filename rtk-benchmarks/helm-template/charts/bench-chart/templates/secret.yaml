{{- range $i := until (int .Values.itemCount) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $.Release.Name }}-secret-{{ $i }}
  labels:
    {{- range $k := until (int $.Values.labelCount) }}
    label-{{ $k }}: {{ sha256sum (printf "%s-%d-sec-%d" $.Release.Name $i $k) | trunc 32 }}
    {{- end }}
type: Opaque
stringData:
  token: {{ include "bench.heavyHash" (dict "seed" (printf "%s-%d-secret" $.Release.Name $i) "rounds" $.Values.hashRounds) }}
  shared: {{ sha256sum (printf "%s-%d" $.Release.Name $i) }}
{{- end }}
