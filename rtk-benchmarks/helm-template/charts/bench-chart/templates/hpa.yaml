{{- range $i := until (int .Values.itemCount) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $.Release.Name }}-hpa-{{ $i }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $.Release.Name }}-bench-{{ $i }}
  minReplicas: {{ $.Values.replicaCount }}
  maxReplicas: {{ add $.Values.replicaCount 8 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
{{- end }}
