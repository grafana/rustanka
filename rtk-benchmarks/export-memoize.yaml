name: "Export (Memoize)"
id: "export-memoize"
description: "Repeated exports sharing a large process-wide rtkMemoize value."
fixtures_dir: "rtk-benchmarks/export-memoize"
skip_tk: true
prepare: "rm -rf {export_dir} && mkdir -p {export_dir}"
tests:
  - name: "Memoized Export (1 worker)"
    description: "256 environments reuse 4096 records with nested objects and labels."
    command: "export {export_dir} {env_dir} --recursive --parallel 1 --format '{{.metadata.namespace}}/{{.kind}}-{{.metadata.name}}' --merge-strategy=fail-on-conflicts"
  - name: "Memoized Export (8 workers)"
    description: "The same workload sharing one manifested value across workers."
    command: "export {export_dir} {env_dir} --recursive --parallel 8 --format '{{.metadata.namespace}}/{{.kind}}-{{.metadata.name}}' --merge-strategy=fail-on-conflicts"
