[package]
name = "rtk-jsonnet-helm"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
gtmpl-ng = { version = "1.0.0", features = ["helm-functions"] }
flate2 = "1.1"
globset = "0.4.18"
base64 = "0.22.1"
tar = "0.4.46"
rsa = { version = "0.9.10", features = ["pem"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
p256 = { version = "0.13.2", features = ["pem"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8", "pem"] }
dsa = "0.6.3"
yasna = "0.5.2"
pem = "3.0"
jsonschema = { version = "0.58.6", default-features = false }
rtk-masterminds.workspace = true
semver.workspace = true
regex.workspace = true
rtk-yaml.workspace = true
ciborium.workspace = true
hex.workspace = true
rtk-jsonnet-core.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tracing.workspace = true
walkdir.workspace = true

[dev-dependencies]
criterion = "0.7"
stats_alloc = "0.1.10"

[features]
benchmarking = []

[[bench]]
name = "native_render"
harness = false
required-features = ["benchmarking"]

[[bench]]
name = "native_render_memory"
harness = false
required-features = ["benchmarking"]

[lints]
workspace = true
