# How many of the generated corpus files `rtk_jsonnetfmt::format` currently
# reproduces byte-identically.
#
# This is the Phase 2 ratchet for breadth. The small, precise fixture families
# get one `quarantine.toml` entry each, because each one names a specific
# behaviour worth arguing about. This corpus is 138 real files and would need
# 138 entries saying nothing more than "the formatter is not finished", so it
# is ratcheted on the count instead. `tests/corpus.rs` prints which files
# differ, so a regression is still actionable.
#
# The test requires this number to match **exactly**, in both directions:
#
#   * fewer matching -> a regression; find it in the printed list
#   * more matching  -> progress; update this number in the same commit
#
# Requiring the update is the point. It makes every improvement a reviewed,
# recorded number rather than a silent drift, the same discipline
# `quarantine.toml` applies to the named fixtures.
#
# 107 of 138 matched while `format` was the identity stub, which said something
# useful on its own: most Jsonnet in this repository is already exactly
# `tk fmt`-clean, so the 31 that differ are the files that actually exercise
# the passes.
#
# Phase 2a took it to 118 by parsing and unparsing with **no passes at all**.
# The arithmetic is worth writing down, because 118 is eleven more than 107 and
# only three of those are the obvious ones:
#
#   * the 107 already-clean files survive the round trip untouched, which is
#     the phase's exit criterion — go-jsonnet's passes are no-ops on input that
#     is already formatted, so for those files `unparse(parse(x)) == x`
#   * 3 files the parser refuses now produce go-jsonnet's error message where
#     before they produced their own text back
#   * 7 files differ from their goldens **only in horizontal whitespace**, and
#     the round trip fixes them for free
#   * 1 file, crates/jrsonnet-formatter/src/tests/string_styles.jsonnet, is a
#     `|||-` block whose value still ends in a newline because a blank line
#     precedes the terminator; the marker and the blank cancel, so it comes
#     back as a plain `|||`
#
# The 7 are the interesting entry. `docs/rtk-fmt-plan.md` describes the round
# trip as preserving what the passes would not change, which understates it:
# **inter-token horizontal whitespace is not fodder at all.** Fodder records
# line ends, blank counts, indents and comments, and nothing else — so every
# space *within* a line is regenerated by the unparser from `crowded`,
# `separate_token` and PadArrays/PadObjects. `{a:1,b:2}` becomes
# `{ a: 1, b: 2 }` with no pass involved. Indentation is the exception and is
# not free: it comes from `fodder.indent`, where the lexer counted a tab as 8,
# so a tab-indented file still needs FixIndentation.
#
# Phase 2b took it to 120: FixTrailingCommas, NoRedundantSliceColon and
# PrettyFieldNames. Two more files, and which two is worth recording, because
# it says what this corpus can and cannot grade:
#
#   * tests/golden/issue153.jsonnet — a quoted field name, `'bar':` -> `bar:`
#   * test_fixtures/golden_envs/conditional_eval_env/main.jsonnet — two more
#     of them, `'pdb':` and `'configmap':`
#
# Both are PrettyFieldNames. Do not read that as the passes having touched
# only two files, though: the pass oracle says which cells actually changed,
# and it is **four** — PrettyFieldNames on those two plus
# tests/golden/builtin_strings_string.jsonnet, and FixTrailingCommas on
# tests/suite/std_param_names.jsonnet. Those last two go on failing because
# they *also* need EnforceStringStyle and FixIndentation, so a real change to
# their AST stays invisible in the byte comparison.
#
# Which is the thing to take from this file. **A count that moves by two says
# almost nothing about whether the passes are right**, and deriving "this pass
# changes nothing" from an input-against-golden text diff is how you conclude
# the opposite of the truth. Nine of the twelve passes change four corpus cells
# or fewer, and NoRedundantSliceColon, EnforceCommentStyle,
# EnforceMaxBlankLines and FixParens change none at all — Jsonnet already
# formatted by `tk fmt` gives a pass nothing to do. This corpus measures the
# end-to-end result; it does not measure the passes.
#
# What measures the passes is testdata/pass-snippets.json through
# `make update-fmt-pass-oracle`; see docs/rtk-fmt-plan.md, Phase 2b.
#
# Phase 2c took it to 123, and this is the first time the arithmetic is
# entirely legible. `EnforceStringStyle` fixes exactly the three files whose
# only remaining difference from their golden was the quote character:
#
#   * tests/suite/rounding.jsonnet — nine double-quoted format strings
#   * tests/suite/sjsonnet_issue_127.jsonnet — three more
#   * tests/golden/issue195.jsonnet — `{ "false": "x" in super }`, which is
#     also the case that says the keyword rule survives: PrettyFieldNames
#     leaves the field name quoted and this pass only changes which quote
#
# Two more files the pass genuinely changes stay red, and they are the reason
# the warning above is worth keeping: tests/golden/builtin_strings_string.jsonnet
# and tests/suite/std_param_names.jsonnet are both tab-indented, so they also
# need FixIndentation and the quote fix is masked in the byte comparison.
#
# `EnforceCommentStyle` contributes **nothing** here, and cannot: it changes no
# corpus cell at all, because a `#` comment in a `tk fmt`-clean file has
# already been rewritten to `//`. It is graded only by the snippets, which is
# what Phase 2c added 57 more of them for.
#
# A drop below 123 means a pass or the round trip broke a file that used to
# pass, and the test prints which. Expect this to reach 138 when the passes are
# finished.
matching = 123
