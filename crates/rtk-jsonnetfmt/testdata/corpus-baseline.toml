# How many of the generated corpus files `rtk_jsonnetfmt::format` currently
# reproduces byte-identically.
#
# This is the Phase 2 ratchet for breadth. The small, precise fixture families
# get one `quarantine.toml` entry each, because each one names a specific
# behaviour worth arguing about. This corpus is 138 real files and would need
# 138 entries saying nothing more than "the formatter is not finished", so it
# is ratcheted on the count instead. `tests/corpus.rs` prints which files
# differ, so a regression is still actionable.
#
# The test requires this number to match **exactly**, in both directions:
#
#   * fewer matching -> a regression; find it in the printed list
#   * more matching  -> progress; update this number in the same commit
#
# Requiring the update is the point. It makes every improvement a reviewed,
# recorded number rather than a silent drift, the same discipline
# `quarantine.toml` applies to the named fixtures.
#
# 107 of 138 matched while `format` was the identity stub, which said something
# useful on its own: most Jsonnet in this repository is already exactly
# `tk fmt`-clean, so the 31 that differ are the files that actually exercise
# the passes.
#
# Phase 2a took it to 118 by parsing and unparsing with **no passes at all**.
# The arithmetic is worth writing down, because 118 is eleven more than 107 and
# only three of those are the obvious ones:
#
#   * the 107 already-clean files survive the round trip untouched, which is
#     the phase's exit criterion — go-jsonnet's passes are no-ops on input that
#     is already formatted, so for those files `unparse(parse(x)) == x`
#   * 3 files the parser refuses now produce go-jsonnet's error message where
#     before they produced their own text back
#   * 7 files differ from their goldens **only in horizontal whitespace**, and
#     the round trip fixes them for free
#   * 1 file, crates/jrsonnet-formatter/src/tests/string_styles.jsonnet, is a
#     `|||-` block whose value still ends in a newline because a blank line
#     precedes the terminator; the marker and the blank cancel, so it comes
#     back as a plain `|||`
#
# The 7 are the interesting entry. the fmt port plan describes the round
# trip as preserving what the passes would not change, which understates it:
# **inter-token horizontal whitespace is not fodder at all.** Fodder records
# line ends, blank counts, indents and comments, and nothing else — so every
# space *within* a line is regenerated by the unparser from `crowded`,
# `separate_token` and PadArrays/PadObjects. `{a:1,b:2}` becomes
# `{ a: 1, b: 2 }` with no pass involved. Indentation is the exception and is
# not free: it comes from `fodder.indent`, where the lexer counted a tab as 8,
# so a tab-indented file still needs FixIndentation.
#
# Phase 2b took it to 120: FixTrailingCommas, NoRedundantSliceColon and
# PrettyFieldNames. Two more files, and which two is worth recording, because
# it says what this corpus can and cannot grade:
#
#   * tests/golden/issue153.jsonnet — a quoted field name, `'bar':` -> `bar:`
#   * test_fixtures/golden_envs/conditional_eval_env/main.jsonnet — two more
#     of them, `'pdb':` and `'configmap':`
#
# Both are PrettyFieldNames. Do not read that as the passes having touched
# only two files, though: the pass oracle says which cells actually changed,
# and it is **four** — PrettyFieldNames on those two plus
# tests/golden/builtin_strings_string.jsonnet, and FixTrailingCommas on
# tests/suite/std_param_names.jsonnet. Those last two go on failing because
# they *also* need EnforceStringStyle and FixIndentation, so a real change to
# their AST stays invisible in the byte comparison.
#
# Which is the thing to take from this file. **A count that moves by two says
# almost nothing about whether the passes are right**, and deriving "this pass
# changes nothing" from an input-against-golden text diff is how you conclude
# the opposite of the truth. Nine of the twelve passes change four corpus cells
# or fewer, and NoRedundantSliceColon, EnforceCommentStyle,
# EnforceMaxBlankLines and FixParens change none at all — Jsonnet already
# formatted by `tk fmt` gives a pass nothing to do. This corpus measures the
# end-to-end result; it does not measure the passes.
#
# What measures the passes is testdata/pass-snippets.json through
# `make update-fmt-pass-oracle`; see CLAUDE.md's Formatting section.
#
# Phase 2c took it to 124, all four of them `EnforceStringStyle`:
#
#   * tests/suite/rounding.jsonnet — nine double-quoted format strings
#   * tests/suite/sjsonnet_issue_127.jsonnet — three more
#   * tests/golden/issue195.jsonnet — `{ "false": "x" in super }`, which is
#     also the case that says the keyword rule survives: PrettyFieldNames
#     leaves the field name quoted and this pass only changes which quote
#   * tests/suite/sjsonnet_issue_1029.jsonnet — `error "3"` -> `error '3'`
#
# **That fourth one was predicted as a no-op and was not.** Its diff against
# its golden is one line, and what stands out in it is `x*x` -> `x * x` and
# `[1,2,` -> `[1, 2,` — horizontal whitespace, which the round trip fixes for
# free. The `error "3"` at the end of the same line was read as part of the
# same whitespace story, so the file was filed under "already passing" and the
# prediction came out at 123. It is the warning below happening again, at the
# level of a single line rather than a whole file, and the fix is the same:
# **ask `pass-oracle.json` which files a pass changes**, rather than reading an
# input-against-golden diff. Its answer here is six files, and it is exact.
#
# The other two of those six stay red, and they are the reason the warning is
# worth keeping: tests/golden/builtin_strings_string.jsonnet and
# tests/suite/std_param_names.jsonnet are both tab-indented, so they also need
# FixIndentation and a real quote fix stays invisible in the byte comparison.
# Six changed cells, four files flipped, two masked.
#
# `EnforceCommentStyle` contributes **nothing** here, and cannot: the oracle
# puts it at zero changed cells of 138, because a `#` comment in a
# `tk fmt`-clean file has already been rewritten to `//`. It is graded only by
# the snippets, which is what Phase 2c added 57 more of them for.
#
# Phase 2d took it to 134, which was predicted as 134 — the first prediction in
# this phase sequence to land exactly, and it landed because it was derived from
# `pass-oracle.json` per file and per pass rather than from reading diffs. Ten
# files, and the split between 2d's two halves is the thing to record:
#
#   * the three small steps (removeInitialNewlines, EnforceMaxBlankLines,
#     FixNewlines, removeExtraTrailingNewlines) moved the count by **zero**
#   * FixIndentation moved it by **ten**
#
# Nine of the ten are the files the oracle attributes to FixIndentation alone:
# crates/jrsonnet-formatter/src/tests/{args,asserts,complex_nested}.jsonnet,
# tests/golden/{builtin_strings,builtin_strings_string,issue126,issue225}.jsonnet,
# tests/suite/comp_if_with_multiple_captures.jsonnet and
# tests/suite/std_param_names.jsonnet. The last two of those are the pair Phase
# 2c recorded as masked: EnforceStringStyle genuinely changed them and they
# stayed red because they are tab-indented, which is exactly what this step
# fixes.
#
# The tenth is test_fixtures/golden_envs/yaml_line_wrapping_env/main.jsonnet,
# and it is the one worth dwelling on. It is the **only** corpus file the oracle
# attributes to FixNewlines — and landing FixNewlines did not flip it. It took
# FixIndentation as well, because FixNewlines only inserts bare
# `LineEnd(0, 0)`s and something then has to indent them. So a file can need
# two passes while the oracle names one, and the count staying at 124 through
# the first half of this phase was correct rather than a bug.
#
# The general form, which is the same warning this file has carried since 2b
# pointed the other way: **the oracle says which passes change a file's AST, and
# that is not the same as saying which passes a file needs.** Read it as a lower
# bound on the work, never as a sufficient set.
#
# The four that remain are all 2e and 2f, and the oracle names them exactly:
#
#   * RemovePlusObject (2e) — tests/golden/deep_mixin_chain.jsonnet,
#     tests/golden/string_object_extend.jsonnet, and
#     test_fixtures/golden_envs/kustomize_job_hash_env/vendor/github.com/
#     jsonnet-libs/docsonnet/doc-util/render.libsonnet
#   * SortImports (2f) — tests/realworld/entry-graalvm.jsonnet
#
# So nothing 2d-shaped is left in this corpus, and 138 is reachable with three
# passes rather than four.
#
# Phase 2e took it to 137: RemovePlusObject's three files, exactly the ones
# named above, and each of them a `+` in front of an object literal that stops
# being written. Two are a single line each and the third is the docsonnet
# render.libsonnet, where the `+` sat at the start of its own line — so the
# LineEnd that preceded it moves on to the object and FixIndentation then has
# to put it back at the right column. That interaction is the one thing 2e
# could not predict from the oracle, because the oracle runs each pass on a
# fresh parse and so grades no pair of them; this corpus is what says it is
# right.
#
# **FixParens and AddPlusObject move this number by zero, and that is the
# check rather than a disappointment.** FixParens changes 0 of the 138 files:
# no Jsonnet here has a doubly-parenthesised expression, which is unsurprising
# in files that are already `tk fmt`-clean. AddPlusObject *cannot* move it —
# the corpus is generated with DefaultOptions, which takes RemovePlusObject and
# skips AddPlusObject entirely, so its 18 oracle cells come from the oracle
# running it in isolation and its only end-to-end grading is the nine
# `no_implicit_plus/` fixtures. If this count ever moves when AddPlusObject
# changes, step 7 has been wired as two steps instead of one `if`.
#
# Phase 2f took it to 138, which is all of them, and **Phase 2 is the thing
# that exits here** rather than just the step: quarantine.toml is empty, this
# corpus is exhaustive, and tests/corpus.rs's idempotence allow-list is still
# empty beside it.
#
# The one file is tests/realworld/entry-graalvm.jsonnet, exactly as the oracle
# named it, and it is worth recording what it took. Two of its fourteen
# top-of-file imports are out of order; SortImports rebuilds the whole chain of
# Locals from the end backwards and the rest of the file is already clean, so
# this is the rare case where the oracle's one cell and the file's one flip are
# the same thing. The prediction was 138 and the measurement was 138, the third
# exact one in a row.
#
# **This corpus grades SortImports about as badly as it has graded anything.**
# One file of 138, and that file is a plain reversal with no comments between
# the imports, no multi-bind local, no second group and no tie. Everything that
# was actually hard here — the fodder split, the VarFodder rotation, the group
# boundaries, the tie order — is graded by the 76 `sort_imports/` snippets and
# by nothing in this directory. Phase 2f added them before a line of the pass,
# per the standing rule, taking testdata/pass-snippets.json from 361 to 437.
#
# Note also what 138 does *not* mean. Nothing in this corpus reaches
# crates/rtk-jsonnetfmt/src/go_sort.rs beyond its insertion-sort path, because
# no file here has two imports of the same path in a group of thirteen or more.
# That port is graded by testdata/go-sort-truth-table.json, 410 cases of which
# 235 have tied keys, and by the `sort_imports/ties_*` snippets.
#
# A drop below 138 means a pass or the round trip broke a file that used to
# pass, and the test prints which.
#
# ============================================================================
# Phase 4: two sets, and a denominator that is no longer 138
# ============================================================================
#
# Everything above is about one set of 138 files. Phase 4 added a second, so
# **"138 of 138" stops being the number to compare against earlier phases** and
# `[sets.in_repo]` below is where that 138 now lives. The old single
# `matching = 138` key is gone rather than kept alongside: one number with two
# homes drifts, which is the same argument the ratchet itself rests on.
#
# The new set is go-jsonnet's own root `testdata/` — 719 files of Jsonnet
# written by people testing a parser and an evaluator, not a formatter. It is
# what Phase 4 of the fmt port plan asks for, and it is the breadth this
# corpus most lacked: the in-repo 138 are overwhelmingly already `tk fmt`-clean
# (107 of them matched while `format` was the identity stub), while these were
# written to be awkward about escapes, text blocks, verbatim strings and
# whitespace.
#
# Where the files come from, and where they do not:
#
#   * in_repo (138) — the five roots in testdata/generate/main.go. Unchanged.
#   * go_jsonnet_testdata (719) — `<checkout>/testdata/*.{jsonnet,libsonnet}`,
#     from the checkout GO_JSONNET_FOR_TESTS names or the one
#     `make go-jsonnet-checkout` clones.
#
# Not added, and each for a reason worth having:
#
#   * cmds/rtk/testdata and crates/rtk-jsonnet/testdata — 173 in-repo files,
#     32 KB between them, almost all sub-100-byte discovery fixtures already in
#     exactly the shape `tk fmt` writes. They would raise the denominator by
#     more than the go-jsonnet set raises the *grading*, which is precisely
#     what this file has been warning about since Phase 2b.
#   * vendored libsonnet beyond what golden_envs already carries. There is no
#     top-level vendor/ here; main.go's `roots` comment used to claim one was
#     included and now says what is actually true. Real vendor breadth is
#     Phase 5's acceptance corpus, fmt-acceptance.toml — which is a second
#     instance of the same lesson: the plan named tk-compare-grafana.toml for
#     that job and that file pointed at this repository's own fixtures. Phase 5
#     renamed it tk-compare-in-repo.toml and built the real corpus separately.
#
# ## Why the two sets are stored differently, which was the design problem
#
# The in-repo set commits only answers, because its inputs are already here.
# The external set commits **inputs and answers together**, in one JSON file.
#
# The alternative — commit only the answers and read the inputs from whatever
# go-jsonnet checkout is lying around — makes the file count depend on the
# machine. This test asserts its counts exactly, in both directions, so an
# environment-dependent denominator is an assertion that cannot hold in both
# environments. That is the GO_JSONNET_FOR_TESTS hazard CLAUDE.md records about
# the `go_jsonnet/` fixture family, one level up and worse: there a missing
# checkout made a family grade silently at zero, here it would make the ratchet
# itself unenforceable. So the artifact is self-contained and the numbers below
# are the same everywhere, on a laptop, in CI and in the nix devShell.
#
# Two consequences, both deliberate:
#
#   * `files` is asserted as well as `matching`. A regenerated artifact that
#     silently lost entries — a checkout without testdata/, a walk that found
#     nothing — would otherwise pass a matching-count check while grading
#     almost nothing. The denominator is ratcheted too.
#   * a declared set whose artifact is missing is a **failure, not a skip**.
#     Both artifacts are committed, so absence means a broken checkout rather
#     than "you have not run the generator yet".
#
# ## Why the in-repo set did not simply grow
#
# The node, pass and lexer oracles are all driven by `corpus/manifest.json`,
# and `tests/node_oracle.rs` asserts the node oracle covers the same list in
# the same order. Adding files to that manifest invalidates about 19 MB of
# committed oracle — node-oracle.json alone is 11 MB — and every go-jsonnet
# bump regenerates the lot. Those oracles exist to grade node kinds, fodder
# slots and one pass at a time, and `node_oracle.rs` already asserts every kind
# and every slot is reached; 719 tiny one-liners would add megabytes for
# essentially no new slot. Text-level breadth belongs at the text level, which
# is what this corpus is.
#
# ## The prediction was 719 and the measurement was 719
#
# The fourth exact one in a row, and the first made without an oracle to query:
# `pass-oracle.json` holds no cell for a file outside the manifest, so unlike
# 2d, 2e and 2f this one could not be derived per file and per pass. What it
# rested on instead:
#
#   * almost every file in the set parses, so the formatter is being asked the
#     ordinary question on nearly all 719.
#
#     **That bullet said "every file parses" and it was wrong.** Fifteen do
#     not. The premise was derived by grepping the set's `.golden` files for
#     "STATIC ERROR" and finding none, which is the wrong instrument: those
#     goldens record *evaluation* output, so a file go-jsonnet's parser refuses
#     has no evaluation golden to say so. The conclusion happened to survive —
#     the count was still exactly right — but a right answer resting on a wrong
#     reason is worth flagging rather than quietly correcting, and it is the
#     same class of error as deriving coverage by grepping inputs.
#
#     The fifteen are a *bonus* rather than a caveat; see below.
#   * the formatter is at full parity everywhere it is already graded: 138 of
#     138, 15 of 15 fixtures, node and pass oracles exact over 63 and 438
#     snippets, 44 parse-error snippets graded on message and location.
#   * the shapes this set adds that the in-repo corpus lacks are each already
#     graded by the snippet oracles. Measured over the 719: 3 files with
#     verbatim strings, 12 with `|||` blocks, 8 tab-indented, 18 non-ASCII,
#     162 with no trailing newline — and 0 with `#` comments, 0 with `\u`
#     escapes, 0 with CRLF, 0 with a BOM.
#
# The named risk, if it misses: at most a handful, clustered in the 18
# non-ASCII files, through `EnforceStringStyle`'s StringUnescape/StringEscape
# round trip — the one thing here the corpus has never exercised at scale.
# Nothing missed, and the named risk was not where anything interesting was.
#
# ## Where the set did pay off: three files whose output does not parse
#
# The match count was exact and the **idempotence** count was not. Three of the
# 719 format to something go-jsonnet's own parser then refuses, and no file
# among the in-repo 138 reaches that at all:
#
#   * object_comp_err_elem.jsonnet and object_literal_in_object_comp.jsonnet —
#     `PrettyFieldNames` promotes `['x']:` to `x:` with no ObjectComp guard,
#     and a comprehension may only have [e] fields
#   * escaped_fields.jsonnet — a `|||` block whose value is nothing but
#     newlines, where the unparser writes a blank value-line with no indent, so
#     no content line carries the block indent and the re-lex eats the
#     terminator
#
# All three are **upstream's**, and that was settled by measurement rather than
# by reading Go: rtk and tk agree byte for byte on the first run — which this
# corpus already proves, all three being inside the 719 — and on the second
# they agree on the refusal *and* on its message and its location.
#
# `tests/corpus.rs` lists them in OUTPUT_DOES_NOT_REPARSE, kept separate from
# KNOWN_NON_CONVERGENT, which is still empty. The distinction is the point: a
# file that formats to a different file is unsettled, while a file that formats
# to one the parser refuses is destroyed, and `tk fmt` writes in place.
#
# ## And fifteen graded parse errors, which were not predicted at all
#
# 15 of the 719 do not parse, so their committed answer is go-jsonnet's error
# message — **message and location**, through the same coalesce-error path the
# in-repo set uses for its three. That is a real gain in a family this
# repository records as thin: before the parse-error snippets, 26 of
# go-jsonnet's 29 parser-error templates had no graded location at all.
#
# These fifteen add eleven distinct templates end to end, and three of them —
# `import_block_literal`, `importstr_block_literal`, `importbin_block_literal` —
# are rendered `(1:8)-(3:4)`, the multi-line form of `LocationRange`. Before
# this, that rendering was graded by essentially one fixture.
#
# Two of them are `object_comp_bad_field.jsonnet` and `..._bad_field2.jsonnet`,
# whose committed answer is "Object comprehensions can only have [e] fields" —
# the very message `PrettyFieldNames` manufactures on the two files below. The
# set contains the error as an input and as an output, from opposite
# directions.
#
# **The argument for extending this corpus is not the one the plan made.**
# Phase 4's item 2 asks for breadth, and breadth is what 719 more
# files sounded like — 719 more chances for the match count to be wrong. The
# match count was not wrong. What the set actually bought was three inputs of a
# class the suite had never seen, in a pass with 27 snippets none of which put
# a computed field inside a comprehension. Two more snippets now do, and two
# lexer snippets pin the block half, because attributing this to a pass by
# reading the diff is the mistake this file has recorded twice. The pass oracle
# then named `PrettyFieldNames` and no other pass, so the attribution is
# measured rather than reasoned.
#
# **One more prediction inside the finding was also wrong, and cheaply.** The
# second snippet was written as the negative that would confine the damage to
# identifier-shaped names. It does not: `{ ['a b']: 1 for x in [1] }` keeps its
# quotes, loses its brackets, and is refused too. The rule is any
# string-literal field name in a comprehension, and only a genuinely computed
# name survives. A negative that fails is worth more than a positive that
# passes, which is the reusable part.

# The set the oracles mirror file for file. This is the 138 every phase above
# is talking about.
[sets.in_repo]
files = 138
matching = 138

# go-jsonnet's own root testdata/, inputs committed alongside the answers.
[sets.go_jsonnet_testdata]
files = 719
matching = 719
