# The three `parse_errors/` entries were removed when the parser landed in
# Phase 2a: `format` now parses, so it refuses these files with go-jsonnet's
# own messages. That is what the ratchet is for — an entry that starts passing
# is deleted in the same commit.
#
# Phase 2b removed none, which is expected: `FixTrailingCommas`,
# `NoRedundantSliceColon` and `PrettyFieldNames` have nothing to do with these
# nine. Its progress shows up in `testdata/corpus-baseline.toml` (118 -> 120)
# and, for the two passes the corpus cannot see at all, in
# `tests/pass_parity.rs`.
#
# Phase 2c removed none either, and could not: not one of the nine inputs
# contains a string literal or a comment. Its progress is in
# `corpus-baseline.toml` (120 -> 124) and in `tests/pass_parity.rs`. (This line
# read "120 -> 123" until Phase 2d: 123 was 2c's *prediction* and 124 was what
# it measured, which is the discrepancy `corpus-baseline.toml` explains at
# length. The predicted number should not have been the one written down here.)
#
# Phase 2d removes none, and this is the last phase that can say so for a
# boring reason. `EnforceMaxBlankLines`, `FixNewlines`, `FixIndentation` and
# the two non-pass steps have nothing to do with inserting a `+` or a paren:
# the nine inputs are each a single line with no comment, no blank line and no
# indentation to fix, so every one of them is already a fixed point of
# everything 2d added. Its progress is in `corpus-baseline.toml` (124 -> 134)
# and in `tests/pass_parity.rs`.
#
# **Phase 2e should empty this file.** All nine entries name `FixParens` or
# `AddPlusObject`, which is exactly what 2e implements, and nothing else is
# listed. If an entry survives 2e it is a divergence and needs a documented
# `CLAUDE.md` entry rather than a line here.
#
# One fixture outside this list does flip, though it is only graded when
# `GO_JSONNET_FOR_TESTS` is set: `go_jsonnet/empty_comment` is `#` above an
# empty object, and go-jsonnet's own `empty_comment.fmt.golden` says the answer
# is `//`. That golden is the single authoritative `tk fmt` answer
# `EnforceCommentStyle` has outside the snippets — the 138-file corpus gives it
# none at all.
