[package]
name = "jrsonnet-stdlib"
description = "Jsonnet standard library implementation for jrsonnet"
keywords = ["jsonnet", "stdlib"]
categories = ["template-engine"]
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
version.workspace = true

[lints]
workspace = true

[features]
experimental = [
  "exp-preserve-order",
  "exp-bigint",
  "exp-null-coaelse",
  "exp-regex",
]
# Add order preservation flag to some functions
exp-preserve-order = ["jrsonnet-evaluator/exp-preserve-order"]
# Bigint type
exp-bigint = ["dep:num-bigint", "jrsonnet-evaluator/exp-bigint"]

exp-null-coaelse = ["jrsonnet-evaluator/exp-null-coaelse"]
# std.regexMatch and other helpers (regex deps are now always enabled)
exp-regex = []

[dependencies]
jrsonnet-evaluator.workspace = true
jrsonnet-macros.workspace = true
jrsonnet-gcmodule.workspace = true

# Used for std.parseJson/std.parseYaml
serde.workspace = true

# std.md5
md5.workspace = true
# std.sha1
sha1.workspace = true
# std.sha256, std.sha512
sha2.workspace = true
# std.sha3
sha3.workspace = true
# std.base64
base64.workspace = true
# std.parseJson
serde_json.workspace = true
# std.parseYaml
serde-saphyr.workspace = true

hex.workspace = true
num-bigint = { workspace = true, optional = true }

# regex (always enabled for Tanka compatibility)
regex.workspace = true
lru.workspace = true
rustc-hash.workspace = true
