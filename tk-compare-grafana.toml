# Configuration for comparing Grafana Tanka (tk) with rustanka (rtk)
# This config runs against grafana/deployment_tools
#
# Usage with Makefile (recommended):
#   make tk-compare-grafana DEPLOYMENT_TOOLS_PATH=/path/to/deployment_tools TK_PATH=/path/to/tk
#
# Environment variables:
#   TK_PATH                - Path to tk executable (required)
#   DEPLOYMENT_TOOLS_PATH  - Path to deployment_tools directory (required)

# Path to Grafana's Tanka (from TK_PATH env var)
tk_exec_1 = "${TK_PATH}"
tk_exec_1_name = "tk"

# Path to rustanka's rtk
tk_exec_2 = "target/release/rtk"
tk_exec_2_name = "rtk"

# Working directory for all commands (from DEPLOYMENT_TOOLS_PATH env var)
working_dir = "${DEPLOYMENT_TOOLS_PATH}/ksonnet"

# Commands to test
# These commands test various Tanka functionality against real Grafana infrastructure configs
# Optional 'runs' parameter specifies how many times to run the command for benchmark statistics
#
# For export commands, use {{EXEC_NAME}} placeholder in output directory to create separate
# output directories for each executable, enabling directory comparison.

# ==================== ENV LIST COMMANDS ====================
[[commands]]
name = "env list: mimir-ops-03"
args = ["env", "list", "environments/cortex/ops-eu-south-0.mimir-ops-03", "--json"]
runs = 5
json_compare = true

[[commands]]
name = "env list: aws-metric-streams"
args = ["env", "list", "environments/aws-metric-streams", "--json"]
runs = 5
json_compare = true

[[commands]]
name = "env list: grafana-o11y"
args = ["env", "list", "environments/grafana-o11y", "--json"]
runs = 5
json_compare = true

[[commands]]
name = "env list: all environments"
args = ["env", "list", "environments", "--json"]
runs = 3
json_compare = true

# ==================== EVAL COMMANDS ====================
[[commands]]
name = "eval: mimir-ops-03"
args = ["eval", "environments/cortex/ops-eu-south-0.mimir-ops-03"]
runs = 3
json_compare = true

[[commands]]
name = "eval: flux-system"
args = ["eval", "environments/flux-system"]
runs = 3
json_compare = true

# ==================== TOOL IMPORTERS COMMANDS ====================
[[commands]]
name = "tool importers: env files"
args = [
    "tool", "importers", 
    "environments/cortex/prod-eu-west-0.mimir-dedicated-33/automated-horizontal-scaling.json", 
    "environments/cortex/prod-eu-west-0.mimir-dedicated-33/automated-scaling.json",
    "environments/cortex/prod-eu-west-0.mimir-dedicated-33/main.jsonnet",
    "environments/cortex/prod-eu-west-0.mimir-dedicated-33/temp.libsonnet",
]
runs = 3

[[commands]]
name = "tool importers: env+lib files"
args = [
    "tool", "importers", 
    "environments/grafana-iam/iam-grafana-app-config.jsonnet", 
    "environments/grafana-iam/iam-grafana-app.jsonnet",
    "lib/argo-workflows-util/utils/cron-workflow.libsonnet",
]
runs = 3

[[commands]]
name = "tool importers: all main files"
args = [
    "tool", "importers", "{{LIST_MAIN_FILES}}",
]
runs = 1

# ==================== EXPORT COMMANDS ====================
# Export commands use {{EXEC_NAME}} placeholder for separate output directories
# {{EXPORT_FORMAT}} is the format string we use for tk
# Note: Export is slower, so fewer runs. dir_compare compares the output directories.

[[commands]]
name = "export: mimir-ops-03"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}/mimir-ops-03", "environments/cortex/ops-eu-south-0.mimir-ops-03", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 3
dir_compare = true

[[commands]]
name = "export: grafana-apps"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}-grafana-apps", "environments/grafana-apps", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 3
dir_compare = true

[[commands]]
name = "export: federal-ge-grafana"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}-federal-ge-grafana", "environments/federal-ge-grafana", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 3
dir_compare = true

[[commands]]
name = "export: flagger"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}-flagger", "environments/flagger", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 3
dir_compare = true

[[commands]]
name = "export: cd environments (tk runs jrsonnet)"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}/mimir-ops-03", "environments/loki-cd", "environments/mimir-cd", "environments/tempo-cd", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 3
dir_compare = true

[[commands]]
name = "export: grafana-o11y (tk runs jrsonnet)"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}/grafana-o11y", "environments/grafana-o11y", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 1
dir_compare = true

[[commands]]
name = "export: two non jrsonnet environments"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}/two-non-jrsonnet-environments", "environments/grafana-com", "environments/grafana-datasources", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 1
dir_compare = true

[[commands]]
name = "export: all loki environments"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}/loki-all", "environments/loki", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 1
dir_compare = true

[[commands]]
name = "export: all cortex environments"
args = ["export", "/tmp/tk-compare-export-{{EXEC_NAME}}/cortex-all", "environments/cortex", "--recursive", "{{EXPORT_FORMAT}}", "--merge-strategy=fail-on-conflicts"]
runs = 1
dir_compare = true
